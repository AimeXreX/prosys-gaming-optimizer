name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fetch and verify PresentMon
        shell: pwsh
        run: ./tools/PresentMon/fetch.ps1
      - name: Build
        run: dotnet build ProSyS.sln -c Release
      - name: Test
        run: dotnet test tests/ProSyS.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/ProSyS.Tests/TestResults/*.trx
